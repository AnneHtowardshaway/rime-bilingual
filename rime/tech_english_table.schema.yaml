# Rime schema
# encoding: utf-8
---
schema:
  schema_id: tech_english_table
  name: "技术英文"
  version: "2026.07.17"
  author:
    - "Local technical vocabulary"
  description: |
    为中文方案的 tech_english 副翻译器提供可编译的独立英文码表。

switches:
  - name: ascii_mode
    reset: 0
    states: [ 技术英文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - table_translator
    - punct_translator
  filters:
    - uniquifier

speller:
  alphabet: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_"

translator:
  dictionary: tech_english_table
  enable_completion: true
  enable_sentence: false
  enable_user_dict: false

punctuator:
  import_preset: default

key_binder:
  import_preset: default

recognizer:
  import_preset: default
...
